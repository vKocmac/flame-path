<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flame-path — έλεγχοι Learning Engine</title>
<style>
  body { background: #141A33; color: #EDE9DC; font-family: 'Segoe UI', sans-serif;
         max-width: 760px; margin: 0 auto; padding: 24px; }
  h1 { color: #FFC857; font-size: 1.2rem; }
  .t { padding: 8px 12px; border-radius: 8px; margin: 5px 0; font-size: .92rem; }
  .ok { background: #12321F; color: #7BE0A3; }
  .fail { background: #3A1220; color: #FF9DB0; }
  .fail small { display: block; color: #E0778F; margin-top: 4px; }
  #sum { font-weight: 700; margin: 16px 0; font-size: 1.05rem; }
</style>
</head>
<body>
<h1>🔥 Έλεγχοι Learning Engine</h1>
<div id="sum">Εκτελούνται…</div>
<div id="out"></div>
<script type="module">
import * as store from './src/shared/storage.js';
import * as engine from './src/learning/engine.js';
import { errorCounts } from './src/learning/telemetry.js';
import { splitGraphemes, classForGrapheme, distractorsFor, stripAccent, AUTO_CLASSES, canBeGap }
  from './src/shared/graphemes.js';

const out = document.getElementById('out');
const sum = document.getElementById('sum');
const results = [];

function assert(cond, msg) { if (!cond) throw new Error(msg); }
function eq(a, b, msg) {
  if (JSON.stringify(a) !== JSON.stringify(b)) {
    throw new Error(`${msg} — περίμενα ${JSON.stringify(b)}, πήρα ${JSON.stringify(a)}`);
  }
}

async function test(name, fn) {
  try { await fn(); results.push({ name, ok: true }); }
  catch (e) { results.push({ name, ok: false, err: e.message }); }
  render();
}
function render() {
  out.innerHTML = results.map((r) =>
    `<div class="t ${r.ok ? 'ok' : 'fail'}">${r.ok ? '✔' : '✘'} ${r.name}${r.ok ? '' : `<small>${r.err}</small>`}</div>`).join('');
  const fails = results.filter((r) => !r.ok).length;
  sum.textContent = fails === 0
    ? `Όλα πράσινα — ${results.length}/${results.length}`
    : `⚠ ${fails} αποτυχίες από ${results.length}`;
  sum.style.color = fails === 0 ? '#7BE0A3' : '#FF9DB0';
}

// --- Υποδομή: πραγματικά δεδομένα στην άκρη, ψεύτικο ρολόι, δικό μας config ---
const BACKUP = localStorage.getItem('flame.state.v1');

let fakeNow = new Date('2026-09-01T10:00:00Z');
const CFG = {
  intervals_days: [0, 1, 3, 7, 14, 30],
  on_error: 'drop_one_level',
  active_set: { size_min: 8, size_max: 10, current_ratio: 0.6, current_word_age_days: 21, intro_when_due_below: 3 },
  practice_after_queue_empty: true,
  practice_serve_cap_per_session: 2,
  decay: { enabled: false }
};

const OLD = '2026-07-01T00:00:00Z';  // «παλιά» λέξη (πέρα από 21 μέρες)
const PAST = '2026-08-31T00:00:00Z'; // ληξιπρόθεσμο nextDueAt
const FUTURE = '2026-09-20T00:00:00Z';

// seed: φτιάχνει καθαρό state με λέξεις. Κάθε spec:
// { text, targets: [{g, start, len, cls, d, level?, introduced?, due?, addedAt?}] }
function seed(specs) {
  localStorage.removeItem('flame.state.v1');
  const s = store.loadState();
  const entry = store.createProfile(s, 'Δοκιμή');
  for (const sp of specs) {
    const w = store.newWord({
      text: sp.text,
      targets: sp.targets.map((t) => ({
        gap: { start: t.start, length: t.len },
        grapheme: t.g,
        confusionClass: t.cls,
        distractors: t.d
      }))
    });
    if (sp.addedAt) w.addedAt = sp.addedAt;
    w.targets.forEach((tg, i) => {
      const t = sp.targets[i];
      if (t.level !== undefined) tg.level = t.level;
      if (t.introduced !== undefined) tg.introduced = t.introduced;
      if (t.due !== undefined) tg.nextDueAt = t.due;
    });
    store.addWord(s, w);
  }
  return { state: s, pid: entry.profile.id };
}

const iT = (over = {}) => ({ g: 'ι', start: 1, len: 1, cls: 'i', d: ['η', 'υ', 'ει', 'οι'], ...over });

await engine.init({ config: CFG, clock: () => fakeNow });

// ---------------------------------------------------------------- Τα tests --

await test('Νέος στόχος: πρώτα τελετή περγαμηνής (intro), χωρίς επιλογές λάθους', async () => {
  const { pid } = seed([{ text: 'λιμάνι', targets: [iT()] }]);
  engine.resetSession();
  const ch = engine.getNextChallenge(pid);
  eq(ch.type, 'intro', 'τύπος');
  assert(!ch.candidates, 'το intro δεν έχει candidates');
  eq(ch.text, 'λιμάνι', 'πάντα η σωστή μορφή');
});

await test('Μετά το intro ο στόχος γίνεται διαθέσιμος στο ίδιο session', async () => {
  const { pid } = seed([{ text: 'λιμάνι', targets: [iT()] }]);
  engine.resetSession();
  const ch1 = engine.getNextChallenge(pid);
  engine.reportResult({ challengeId: ch1.challengeId, wordId: ch1.wordId, targetId: ch1.targetId, profileId: pid, type: 'intro', correct: true, chosenGrapheme: null, revealUsed: false, durationMs: 0 });
  const ch2 = engine.getNextChallenge(pid);
  assert(ch2.type === 'gap' || ch2.type === 'assembly', `πήρα ${ch2.type}`);
});

await test('Σωστή απάντηση: επίπεδο +1, επανεμφάνιση σε 1 μέρα (επ. 1)', async () => {
  const { pid, state } = seed([{ text: 'λιμάνι', targets: [iT({ introduced: true, due: PAST })] }]);
  engine.resetSession();
  const ch = engine.getNextChallenge(pid);
  engine.reportResult({ challengeId: ch.challengeId, wordId: ch.wordId, targetId: ch.targetId, profileId: pid, type: ch.type, correct: true, chosenGrapheme: null, revealUsed: false, durationMs: 900 });
  const t = store.activeProfile(store.loadState()).words[0].targets[0];
  eq(t.level, 1, 'επίπεδο');
  eq(t.successes, 1, 'επιτυχίες');
  const dueMs = new Date(t.nextDueAt) - fakeNow;
  assert(Math.abs(dueMs - 86400000) < 5000, `διάστημα ${dueMs}ms αντί ~1 μέρας`);
});

await test('Λάθος: επίπεδο -1, καταγράφεται ΠΟΙΟ γράφημα διάλεξε, ξανά στο ίδιο session', async () => {
  const { pid } = seed([{ text: 'λιμάνι', targets: [iT({ level: 1, introduced: true, due: PAST })] }]);
  engine.resetSession();
  const ch = engine.getNextChallenge(pid, { types: ['gap'] });
  engine.reportResult({ challengeId: ch.challengeId, wordId: ch.wordId, targetId: ch.targetId, profileId: pid, type: 'gap', correct: false, chosenGrapheme: 'η', revealUsed: true, durationMs: 2100 });
  const t = store.activeProfile(store.loadState()).words[0].targets[0];
  eq(t.level, 0, 'επίπεδο');
  eq(t.errorHistory[0].grapheme, 'η', 'λάθος γράφημα');
  assert(new Date(t.nextDueAt) <= fakeNow, 'επίπεδο 0 → ξανά μέσα στο session');
});

await test('Invariant 6: δεύτερη αναφορά για το ίδιο challenge αγνοείται', async () => {
  const { pid } = seed([{ text: 'λιμάνι', targets: [iT({ introduced: true, due: PAST })] }]);
  engine.resetSession();
  const ch = engine.getNextChallenge(pid);
  const rep = { challengeId: ch.challengeId, wordId: ch.wordId, targetId: ch.targetId, profileId: pid, type: ch.type, correct: true, chosenGrapheme: null, revealUsed: false, durationMs: 0 };
  eq(engine.reportResult(rep).ok, true, 'πρώτη αναφορά');
  eq(engine.reportResult(rep).ok, false, 'δεύτερη αναφορά');
  const t = store.activeProfile(store.loadState()).words[0].targets[0];
  eq(t.attempts, 1, 'μία μόνο προσπάθεια');
});

await test('Ποτέ δύο στόχοι της ίδιας λέξης συνεχόμενα', async () => {
  const { pid } = seed([
    { text: 'ωδείο', targets: [
      { g: 'ω', start: 0, len: 1, cls: 'o', d: ['ο'], introduced: true, due: PAST },
      { g: 'εί', start: 2, len: 2, cls: 'i', d: ['ί', 'ή', 'ύ', 'οί'], introduced: true, due: PAST }] },
    { text: 'λιμάνι', targets: [iT({ introduced: true, due: PAST })] }
  ]);
  engine.resetSession();
  let prev = null;
  for (let i = 0; i < 6; i++) {
    const ch = engine.getNextChallenge(pid);
    assert(ch.wordId !== prev, `βήμα ${i}: ίδια λέξη δύο φορές`);
    prev = ch.wordId;
  }
});

await test('Μίγμα ενεργού συνόλου ~60% τρέχουσες / 40% παλιές (10 θέσεις → 6+4)', async () => {
  const specs = [];
  for (let i = 0; i < 12; i++) specs.push({ text: 'νεα' + i, targets: [{ g: 'ε', start: 1, len: 1, cls: 'e', d: ['αι'], level: 0, introduced: true, due: PAST }] });
  for (let i = 0; i < 12; i++) specs.push({ text: 'παλια' + i, addedAt: OLD, targets: [{ g: 'ι', start: 3, len: 1, cls: 'i', d: ['η', 'υ'], level: 3, introduced: true, due: PAST }] });
  const { pid } = seed(specs);
  engine.resetSession();
  const seen = new Set(); let cur = 0, rev = 0;
  for (let i = 0; i < 10; i++) {
    const ch = engine.getNextChallenge(pid);
    if (seen.has(ch.targetId)) continue;
    seen.add(ch.targetId);
    if (ch.text.startsWith('νεα')) cur++; else rev++;
  }
  eq(cur, 6, 'τρέχουσες'); eq(rev, 4, 'παλιές');
});

await test('Άδεια ουρά → προπόνηση (isPractice) που ΔΕΝ αλλάζει επίπεδο/πρόγραμμα', async () => {
  const { pid } = seed([{ text: 'λιμάνι', targets: [iT({ level: 4, introduced: true, due: FUTURE })] }]);
  engine.resetSession();
  const ch = engine.getNextChallenge(pid);
  eq(ch.isPractice, true, 'isPractice');
  engine.reportResult({ challengeId: ch.challengeId, wordId: ch.wordId, targetId: ch.targetId, profileId: pid, type: ch.type, correct: true, chosenGrapheme: null, revealUsed: false, durationMs: 0 });
  const t = store.activeProfile(store.loadState()).words[0].targets[0];
  eq(t.level, 4, 'επίπεδο αμετάβλητο');
  eq(t.nextDueAt, FUTURE, 'πρόγραμμα αμετάβλητο');
  eq(t.attempts, 1, 'αλλά το telemetry μετράει');
});

await test('Συναρμολόγηση: ΜΟΝΟ τα γνήσια γραφήματα, ποτέ σε σωστή σειρά', async () => {
  const { pid } = seed([{ text: 'ωδείο', targets: [{ g: 'ω', start: 0, len: 1, cls: 'o', d: ['ο'], introduced: true, due: PAST }] }]);
  engine.resetSession();
  const ch = engine.getNextChallenge(pid, { types: ['assembly'] });
  eq(ch.type, 'assembly', 'τύπος');
  eq([...ch.pieces].sort(), [...splitGraphemes('ωδείο')].sort(), 'ίδιο σύνολο γραφημάτων');
  assert(ch.pieces.join('') !== 'ωδείο', 'όχι έτοιμη σωστή σειρά');
});

await test('Κενό: υποψήφια = στόχος + όλα τα distractors, ανακατεμένα', async () => {
  const { pid } = seed([{ text: 'λιμάνι', targets: [iT({ introduced: true, due: PAST })] }]);
  engine.resetSession();
  const ch = engine.getNextChallenge(pid, { types: ['gap'] });
  eq([...ch.candidates].sort(), ['ει', 'η', 'ι', 'οι', 'υ'].sort(), 'σύνολο υποψηφίων');
});

await test('Στόχος χωρίς distractors (ου): το gap αποκλείεται, πάει σε συναρμολόγηση', async () => {
  const { pid } = seed([{ text: 'που', targets: [{ g: 'ου', start: 1, len: 2, cls: 'u', d: [], introduced: true, due: PAST }] }]);
  engine.resetSession();
  const ch = engine.getNextChallenge(pid, { types: ['gap', 'assembly'] });
  eq(ch.type, 'assembly', 'τύπος');
});

await test('Εναλλαγή τύπων: η ίδια λέξη δεν ξαναπέφτει στον ίδιο μηχανισμό', async () => {
  const { pid } = seed([{ text: 'λιμάνι', targets: [iT({ introduced: true, due: PAST })] }]);
  engine.resetSession();
  const ch1 = engine.getNextChallenge(pid);
  engine.reportResult({ challengeId: ch1.challengeId, wordId: ch1.wordId, targetId: ch1.targetId, profileId: pid, type: ch1.type, correct: false, chosenGrapheme: 'η', revealUsed: true, durationMs: 0 });
  const ch2 = engine.getNextChallenge(pid);
  assert(ch2.type !== ch1.type, `δύο φορές ${ch1.type}`);
});

await test('Διαστήματα ανά επίπεδο: επ. 3 → σωστό → επ. 4 → +14 μέρες', async () => {
  const { pid } = seed([{ text: 'λιμάνι', targets: [iT({ level: 3, introduced: true, due: PAST })] }]);
  engine.resetSession();
  const ch = engine.getNextChallenge(pid);
  engine.reportResult({ challengeId: ch.challengeId, wordId: ch.wordId, targetId: ch.targetId, profileId: pid, type: ch.type, correct: true, chosenGrapheme: null, revealUsed: false, durationMs: 0 });
  const t = store.activeProfile(store.loadState()).words[0].targets[0];
  eq(t.level, 4, 'επίπεδο');
  const days = (new Date(t.nextDueAt) - fakeNow) / 86400000;
  assert(Math.abs(days - 14) < 0.01, `${days} μέρες αντί 14`);
});

await test('Telemetry: τα λάθη αθροίζονται ανά κλάση και γράφημα', async () => {
  const { pid } = seed([{ text: 'λιμάνι', targets: [iT({ introduced: true, due: PAST })] }]);
  engine.resetSession();
  for (let i = 0; i < 3; i++) {
    const ch = engine.getNextChallenge(pid, { types: ['gap'] });
    engine.reportResult({ challengeId: ch.challengeId, wordId: ch.wordId, targetId: ch.targetId, profileId: pid, type: 'gap', correct: false, chosenGrapheme: i < 2 ? 'η' : 'υ', revealUsed: true, durationMs: 0 });
  }
  const agg = errorCounts(store.activeProfile(store.loadState()));
  eq(agg.i['η'], 2, 'μετρητής η');
  eq(agg.i['υ'], 1, 'μετρητής υ');
});

await test('Οι νέοι στόχοι δεν σερβίρονται όλοι μαζί — το πολύ 3 τελετές στη σειρά', async () => {
  const specs = [];
  for (let i = 0; i < 7; i++) {
    specs.push({ text: 'λεξη' + i, targets: [{ g: 'ε', start: 1, len: 1, cls: 'e', d: ['αι'] }] });
  }
  const { pid } = seed(specs);
  engine.resetSession();
  let introStreak = 0, maxStreak = 0;
  for (let i = 0; i < 10; i++) {
    const ch = engine.getNextChallenge(pid);
    if (!ch) break;
    if (ch.type === 'intro') { introStreak++; maxStreak = Math.max(maxStreak, introStreak); }
    else introStreak = 0;
    engine.reportResult({ challengeId: ch.challengeId, wordId: ch.wordId, targetId: ch.targetId, profileId: pid, type: ch.type, correct: true, chosenGrapheme: null, revealUsed: false, durationMs: 0 });
  }
  assert(maxStreak <= 3, `${maxStreak} συνεχόμενες τελετές`);
});

await test('Χωρίς καμία λέξη το engine επιστρέφει null (το παιχνίδι το χειρίζεται)', async () => {
  const { pid } = seed([]);
  engine.resetSession();
  eq(engine.getNextChallenge(pid), null, 'null');
});

// ------------------------------- Στόχος που δεν παίζεται δεν παρουσιάζεται

await test('Στόχος χωρίς distractors ΔΕΝ παίρνει τελετή όταν ζητάμε μόνο κενό', () => {
  // Το «ου» είναι μόνο του στην κλάση του: καμία εναλλακτική, κανένα κενό.
  // Αν έπαιρνε τελειτή, η λέξη θα καιγόταν στον πάπυρο και μετά δεν θα
  // μπορούσε να ρωτηθεί ΠΟΤΕ — και το παιχνίδι έλεγε «δεν έχω τεχνικές».
  const { pid } = seed([{ text: 'ουρανού', targets: [
    { start: 0, len: 2, g: 'ου', cls: 'u', d: [] },
    { start: 5, len: 2, g: 'ού', cls: 'u', d: [] }
  ] }]);
  engine.resetSession();
  eq(engine.getNextChallenge(pid, { types: ['gap'] }), null, 'τίποτα δεν σερβίρεται');
});

await test('Ο ίδιος στόχος ΠΑΙΡΝΕΙ τελετή όταν επιτρέπεται και συναρμολόγηση', () => {
  const { pid } = seed([{ text: 'ουρανού', targets: [
    { start: 0, len: 2, g: 'ου', cls: 'u', d: [] }
  ] }]);
  engine.resetSession();
  const ch = engine.getNextChallenge(pid, { types: ['gap', 'assembly'] });
  assert(ch && ch.type === 'intro', `περίμενα intro, πήρα ${ch && ch.type}`);
});

await test('Λέξη με ΕΝΑ παίξιμο σημείο σερβίρεται κανονικά, το άπαιχτο αγνοείται', () => {
  const { pid } = seed([{ text: 'λουλούδι', targets: [
    { start: 1, len: 2, g: 'ου', cls: 'u', d: [] },
    { start: 6, len: 1, g: 'ι', cls: 'i', d: ['η', 'υ', 'ει', 'οι'] }
  ] }]);
  engine.resetSession();
  const a = engine.getNextChallenge(pid, { types: ['gap'] });
  assert(a && a.type === 'intro', 'πρώτα η τελετή του παίξιμου στόχου');
  eq(a.gap.start, 6, 'και είναι ο στόχος «ι», όχι το «ου»');
});

await test('Το «ου» δεν προεπιλέγεται πια — δεν ρωτιέται με κενό', () => {
  assert(!AUTO_CLASSES.includes('u'), 'το u δεν πρέπει να προεπιλέγεται');
  assert(!canBeGap('ου'), 'το ου δεν γίνεται κενό');
  assert(canBeGap('ι') && canBeGap('αυ') && canBeGap('νν'), 'τα υπόλοιπα γίνονται');
});

// --------------------------------------------------- Διαλυτικά (NEXT-FIXES Β2)

await test('Τα διαλυτικά μένουν ΕΝΩΜΕΝΑ στον τεμαχισμό — μία μονάδα, όχι δύο', () => {
  eq(splitGraphemes('αϋπνία'), ['αϋ', 'π', 'ν', 'ί', 'α'], 'αϋπνία');
  eq(splitGraphemes('ευνοϊκό'), ['ευ', 'ν', 'οϊ', 'κ', 'ό'], 'ευνοϊκό');
  eq(splitGraphemes('θεϊκός'), ['θ', 'εϊ', 'κ', 'ό', 'ς'], 'θεϊκός');
  eq(splitGraphemes('μαϊμού'), ['μ', 'αϊ', 'μ', 'ού'], 'μαϊμού');
});

await test('Δυαδική ερώτηση: αυ↔αϋ και ευ↔εϋ, ακριβώς ένας distractor', () => {
  eq(distractorsFor('αϋ'), ['αυ'], 'αϋ → αυ');
  eq(distractorsFor('αυ'), ['αϋ'], 'αυ → αϋ');
  eq(distractorsFor('ευ'), ['εϋ'], 'ευ → εϋ');
  eq(distractorsFor('εϋ'), ['ευ'], 'εϋ → ευ');
});

await test('Το «οι» μένει ερώτημα /i/ — μόνο το «οϊ» ρωτά για διαλυτικά', () => {
  eq(classForGrapheme('οι'), 'i', 'οι ανήκει στο /i/');
  eq(distractorsFor('οι'), ['ι', 'η', 'υ', 'ει'], 'οι → τα άλλα /i/');
  eq(classForGrapheme('οϊ'), 'oi_dia', 'οϊ ανήκει στα διαλυτικά');
  eq(distractorsFor('οϊ'), ['οι'], 'οϊ → οι');
});

await test('Ο τόνος κληρονομείται: ΐ/ΰ κρατούν τα διαλυτικά όταν φεύγει ο τόνος', () => {
  eq(stripAccent('εΐ'), 'εϊ', 'ο τόνος φεύγει, τα διαλυτικά μένουν');
  eq(splitGraphemes('πρωτεΐνη')[4], 'εΐ', 'πρωτεΐνη → εΐ');
  eq(distractorsFor('εΐ'), ['εί'], 'εΐ → εί, τονισμένο κι αυτό');
  eq(distractorsFor('αΰ'), ['αύ'], 'αΰ → αύ');
});

await test('Καμία υποψήφια δεν είναι ίδια με τον στόχο', () => {
  for (const g of ['αυ', 'αϋ', 'ευ', 'εϋ', 'οϊ', 'εϊ', 'αϊ', 'εΐ', 'ι', 'ω', 'αι']) {
    assert(!distractorsFor(g).includes(g), `${g} έχει τον εαυτό του ως distractor`);
    assert(new Set(distractorsFor(g)).size === distractorsFor(g).length,
      `${g} έχει διπλό distractor`);
  }
});

// ---------------------------------------------- Διπλά σύμφωνα (NEXT-FIXES Β3)

await test('Το διπλό σύμφωνο είναι ΜΙΑ μονάδα ορθογραφίας', () => {
  eq(splitGraphemes('γέννηση'), ['γ', 'έ', 'νν', 'η', 'σ', 'η'], 'γέννηση');
  eq(splitGraphemes('θάλασσα'), ['θ', 'ά', 'λ', 'α', 'σσ', 'α'], 'θάλασσα');
  eq(splitGraphemes('εκκλησία'), ['ε', 'κκ', 'λ', 'η', 'σ', 'ί', 'α'], 'εκκλησία');
});

await test('Απλό ↔ διπλό: υποψήφια διαφορετικού μήκους στο ίδιο κενό', () => {
  eq(distractorsFor('νν'), ['ν'], 'νν → ν');
  eq(distractorsFor('ν'), ['νν'], 'ν → νν');
  eq(distractorsFor('σσ'), ['σ'], 'σσ → σ');
});

await test('γγ ↔ γκ (άγγελος / αγκάλη) — ΟΧΙ γ ↔ γγ, που ακούγονται αλλιώς', () => {
  eq(splitGraphemes('άγγελος')[1], 'γγ', 'άγγελος → γγ');
  eq(splitGraphemes('αγκάλη')[1], 'γκ', 'αγκάλη → γκ');
  eq(distractorsFor('γγ'), ['γκ'], 'γγ → γκ');
  eq(distractorsFor('γκ'), ['γγ'], 'γκ → γγ');
  eq(classForGrapheme('γ'), null, 'το σκέτο γ δεν είναι στόχος');
});

await test('Τα διπλά σύμφωνα ΔΕΝ προεπιλέγονται — τα διαλέγει ο γονιός', () => {
  for (const c of ['nn', 'ss', 'll', 'gg', 'kk']) {
    assert(!AUTO_CLASSES.includes(c), `${c} δεν πρέπει να προεπιλέγεται`);
  }
  for (const c of ['i', 'o', 'e', 'au', 'oi_dia']) {
    assert(AUTO_CLASSES.includes(c), `${c} πρέπει να προεπιλέγεται`);
  }
});

// ------------------------------------------ Πότε επιτρέπεται τελετή (NEXT-FIXES Δ1)

const reportAs = (pid, ch, correct = true, chosen = null) => engine.reportResult({
  challengeId: ch.challengeId, wordId: ch.wordId, targetId: ch.targetId, profileId: pid,
  type: ch.type, correct, chosenGrapheme: chosen, revealUsed: !correct, durationMs: 0
});
const oT = { g: 'ω', start: 0, len: 1, cls: 'o', d: ['ο'] };

await test("intro:'first' — ΟΛΕΣ οι νέες λέξεις στη σειρά, χωρίς το όριο των 3", async () => {
  const specs = [];
  for (let i = 0; i < 7; i++) {
    specs.push({ text: 'λεξη' + i, targets: [{ g: 'ε', start: 1, len: 1, cls: 'e', d: ['αι'] }] });
  }
  const { pid } = seed(specs);
  engine.resetSession();
  const seen = [];
  for (let i = 0; i < 7; i++) {
    const ch = engine.getNextChallenge(pid, { types: ['gap'], intro: 'first' });
    eq(ch.type, 'intro', `κλήση ${i + 1}`);
    seen.push(ch.text);
    reportAs(pid, ch);
  }
  eq(new Set(seen).size, 7, 'και οι 7 λέξεις');
  eq(engine.getNextChallenge(pid, { types: ['gap'], intro: 'first' }).type, 'gap', 'μετά, κανονική μάχη');
});

await test("intro:'first' — τα σημεία της ίδιας λέξης έρχονται μαζί (όχι μισή λέξη)", async () => {
  const { pid } = seed([
    { text: 'λιμάνι', targets: [iT(), iT({ start: 5 })] },
    { text: 'ωδείο', targets: [oT] }
  ]);
  engine.resetSession();
  const seq = [];
  for (let i = 0; i < 3; i++) {
    const ch = engine.getNextChallenge(pid, { types: ['gap'], intro: 'first' });
    seq.push(`${ch.text}:${ch.gap.start}`);
    reportAs(pid, ch);
  }
  eq(seq, ['λιμάνι:1', 'λιμάνι:5', 'ωδείο:0'], 'σειρά');
});

await test("intro:'never' — ποτέ τελετή στη μέση του λεβελ", async () => {
  const { pid } = seed([
    { text: 'λιμάνι', targets: [iT({ introduced: true, due: PAST })] },
    { text: 'ωδείο', targets: [oT] }                    // νέα, όχι ακόμα
  ]);
  engine.resetSession();
  for (let i = 0; i < 4; i++) {
    const ch = engine.getNextChallenge(pid, { types: ['gap'], intro: 'never' });
    assert(ch && ch.type !== 'intro', `κλήση ${i + 1}: ${ch && ch.type}`);
    eq(ch.text, 'λιμάνι', 'μόνο η εισηγμένη');
    reportAs(pid, ch);
  }
  seed([{ text: 'ωδείο', targets: [oT] }]);
  engine.resetSession();
  const pid2 = store.loadState().activeProfileId;
  eq(engine.getNextChallenge(pid2, { types: ['gap'], intro: 'never' }), null, 'μόνο νέες → τίποτα');
});

await test('Μετά από χαμένη λέξη έρχεται ΑΛΛΗ λέξη, όταν υπάρχει', async () => {
  const { pid } = seed([
    { text: 'λιμάνι', targets: [iT({ introduced: true, due: PAST }), iT({ start: 5, introduced: true, due: PAST })] },
    { text: 'ωδείο', targets: [{ ...oT, introduced: true, due: PAST }] }
  ]);
  engine.resetSession();
  for (let round = 0; round < 3; round++) {
    const ch = engine.getNextChallenge(pid, { types: ['gap'], intro: 'never' });
    reportAs(pid, ch, false, ch.candidates.find((c) => c !== ch.text.substr(ch.gap.start, ch.gap.length)));
    const next = engine.getNextChallenge(pid, { types: ['gap'], intro: 'never' });
    assert(next.wordId !== ch.wordId, `γύρος ${round + 1}: ξανά «${next.text}»`);
    reportAs(pid, next);
  }
});

// ------------------------------------- Προφίλ και πρόοδος (NEXT-FIXES Ε1/Ε6/Ε7)

// Ένα προφίλ με μια λέξη που έχει ΠΡΟΟΔΟ: επίπεδο 3, σπίθες, ιστορικό.
function seedWithProgress() {
  const { state, pid } = seed([{ text: 'λιμάνι', targets: [iT({ level: 3, introduced: true, due: FUTURE })] }]);
  const s = store.loadState();
  const t = store.activeProfile(s).words[0].targets[0];
  t.attempts = 5; t.successes = 4;
  t.errorHistory = [{ grapheme: 'η', type: 'gap', at: PAST }];
  store.saveState(s);
  store.addSparks(s, 42);
  return { pid };
}

await test('Μηδενισμός προόδου: μένουν οι λέξεις, φεύγουν επίπεδα, ιστορικό και σπίθες', () => {
  const { pid } = seedWithProgress();
  const s = store.loadState();
  store.resetProgress(s, pid);
  const p = store.activeProfile(store.loadState());
  eq(p.words.length, 1, 'η λέξη μένει');
  const t = p.words[0].targets[0];
  eq([t.level, t.attempts, t.successes, t.errorHistory.length, t.introduced, t.nextDueAt],
     [0, 0, 0, 0, false, null], 'ο στόχος σαν καινούργιος');
  eq(t.grapheme, 'ι', 'ο στόχος ίδιος');
  eq(store.getSparks(store.loadState()), 0, 'μηδέν σπίθες');
});

await test('Νέο προφίλ με τις λέξεις του άλλου: ΧΩΡΙΣ πρόοδο, και ο πρώτος δεν πειράζεται', () => {
  const { pid } = seedWithProgress();
  const s = store.loadState();
  const src = store.activeProfile(s);
  const trial = store.createProfile(s, 'Δοκιμή', { words: src.words });
  store.setActiveProfile(s, trial.profile.id);
  const s2 = store.loadState();
  const tp = store.activeProfile(s2);
  eq(tp.profile.name, 'Δοκιμή', 'ενεργό το νέο');
  eq(tp.words[0].text, 'λιμάνι', 'ίδια λέξη');
  eq(tp.words[0].targets[0].level, 0, 'χωρίς πρόοδο');
  assert(tp.words[0].id !== src.words[0].id, 'νέο id λέξης');
  assert(tp.words[0].targets[0].id !== src.words[0].targets[0].id, 'νέο id στόχου');
  const orig = s2.profiles.find((x) => x.profile.id === pid);
  eq(orig.words[0].targets[0].level, 3, 'το αρχικό κράτησε το επίπεδό του');
  eq(orig.profile.sparks, 42, 'και τις σπίθες του');
});

await test('Η μάχη διαβάζει ΜΟΝΟ το ενεργό προφίλ', () => {
  seed([{ text: 'λιμάνι', targets: [iT({ introduced: true, due: PAST })] }]);
  const s = store.loadState();
  const other = store.createProfile(s, 'Άδειο');
  engine.resetSession();
  eq(engine.getNextChallenge(other.profile.id), null, 'το άδειο προφίλ δεν έχει λέξεις');
});

await test('Διαγραφή προφίλ: το ενεργό περνά σε άλλο· το τελευταίο δεν σβήνεται', () => {
  const { pid } = seed([{ text: 'λιμάνι', targets: [iT()] }]);
  const s = store.loadState();
  eq(store.deleteProfile(s, pid), false, 'μόνο ένα προφίλ — δεν σβήνεται');
  const b = store.createProfile(s, 'Β');
  store.setActiveProfile(s, b.profile.id);
  eq(store.deleteProfile(s, b.profile.id), true, 'σβήνεται όταν υπάρχει άλλο');
  const s2 = store.loadState();
  eq(s2.profiles.length, 1, 'έμεινε ένα');
  eq(s2.activeProfileId, pid, 'ενεργό έγινε το άλλο');
});

await test('Εξαγωγή «μόνο λέξεις»: καμία πρόοδος μέσα στο αρχείο', () => {
  seedWithProgress();
  const data = JSON.parse(store.exportJSON(store.loadState(), { progress: false }));
  eq(data.kind, 'words', 'είδος');
  const t = data.profiles[0].words[0].targets[0];
  eq([t.level, t.attempts, t.errorHistory.length, t.introduced], [0, 0, 0, false], 'καθαρός στόχος');
  eq(data.profiles[0].profile.sparks, 0, 'μηδέν σπίθες');
  eq(store.activeProfile(store.loadState()).words[0].targets[0].level, 3, 'η συσκευή δεν πειράχτηκε');
  const full = JSON.parse(store.exportJSON(store.loadState(), { progress: true }));
  eq(full.profiles[0].words[0].targets[0].level, 3, 'η πλήρης κρατά την πρόοδο');
});

await test('Εισαγωγή λέξεων: ΠΡΟΣΘΕΤΕΙ μόνο όσες λείπουν, χωρίς να σβήσει πρόοδο', () => {
  seedWithProgress();
  const file = JSON.stringify({
    schemaVersion: 2, profiles: [{ profile: { id: 'x', name: 'Άλλος' }, words: [
      store.newWord({ text: 'λιμάνι', targets: [{ gap: { start: 1, length: 1 }, grapheme: 'ι', confusionClass: 'i', distractors: ['η'] }] }),
      store.newWord({ text: 'ώρα', targets: [{ gap: { start: 0, length: 1 }, grapheme: 'ώ', confusionClass: 'o', distractors: ['ό'] }] })
    ] }]
  });
  const n = store.importWords(store.loadState(), file);
  eq(n, 1, 'μπήκε μόνο το «ώρα»');
  const p = store.activeProfile(store.loadState());
  eq(p.words.map((w) => w.text), ['λιμάνι', 'ώρα'], 'λέξεις');
  eq(p.words[0].targets[0].level, 3, 'η υπάρχουσα πρόοδος έμεινε');
});

// ------------------------------------------ Μεγάλη Τεχνική (BUILD_PLAN βήμα 5)

await test('«ου»: με κενό δεν σερβίρεται — στο ΕΠΟΜΕΝΟ αίτημα με συναρμολόγηση ναι', async () => {
  const { pid } = seed([{ text: 'ουρά', targets: [{ g: 'ου', start: 0, len: 2, cls: 'u', d: [], introduced: true, due: PAST }] }]);
  engine.resetSession();
  eq(engine.getNextChallenge(pid, { types: ['gap'], intro: 'never' }), null, 'μόνο κενό → τίποτα');
  const ch = engine.getNextChallenge(pid, { types: ['gap', 'assembly'], intro: 'never' });
  assert(ch, 'με συναρμολόγηση πρέπει να έρθει');
  eq(ch.type, 'assembly', 'τύπος');
  eq([...ch.pieces].sort(), ['ου', 'ρ', 'ά'].sort(), 'μόνο τα γνήσια γραφήματα');
});

await test('Άνοιγμα λεβελ: η λέξη με «ου» παρουσιάζεται όταν επιτρέπεται συναρμολόγηση', async () => {
  const { pid } = seed([{ text: 'ουρά', targets: [{ g: 'ου', start: 0, len: 2, cls: 'u', d: [] }] }]);
  engine.resetSession();
  const ch = engine.getNextChallenge(pid, { types: ['gap', 'assembly'], intro: 'first' });
  eq(ch.type, 'intro', 'τελετή');
  eq(ch.text, 'ουρά', 'η λέξη');
});

// ---------------------------------------------- Ο Δρόμος της Φλόγας (NEXT-FIXES Ε3)

await test('Ο Δρόμος: αρχή στον σταθμό 1· η νίκη προχωρά σταθμό και σώζεται', () => {
  seed([{ text: 'λιμάνι', targets: [iT()] }]);
  const s = store.loadState();
  eq(store.getJourney(s), { station: 0, cycle: 0, storySeen: false }, 'αρχή');
  const r = store.advanceJourney(s, 7);
  eq([r.station, r.cycle, r.finished], [1, 0, false], 'σταθμός 2');
  eq(store.getJourney(store.loadState()).station, 1, 'σώθηκε');
});

await test('Ο Δρόμος: νίκη στο κάστρο (7ος σταθμός) → νέος κύκλος, νέα ζώνη', () => {
  seed([{ text: 'λιμάνι', targets: [iT()] }]);
  const s = store.loadState();
  for (let i = 0; i < 6; i++) store.advanceJourney(s, 7);
  eq(store.getJourney(store.loadState()).station, 6, 'στο κάστρο');
  const r = store.advanceJourney(s, 7);
  eq([r.station, r.cycle, r.finished], [0, 1, true], 'νέος κύκλος');
});

await test('Μηδενισμός και εξαγωγή «μόνο λέξεις» σβήνουν και τον Δρόμο', () => {
  const { pid } = seed([{ text: 'λιμάνι', targets: [iT()] }]);
  const s = store.loadState();
  store.advanceJourney(s, 7);
  store.markStorySeen(s);
  const data = JSON.parse(store.exportJSON(store.loadState(), { progress: false }));
  assert(!data.profiles[0].profile.journey, 'χωρίς Δρόμο στο αρχείο');
  store.resetProgress(store.loadState(), pid);
  eq(store.getJourney(store.loadState()), { station: 0, cycle: 0, storySeen: false }, 'από την αρχή');
});

await test('Δυνάμεις: ξεκλειδώνουν με τους σταθμούς· στον 2ο κύκλο όλες', async () => {
  const journey = await import('./src/game/journey.js');
  eq(journey.unlockedPowers(0, 0), ['tornado'], 'σταθμός 1');
  eq(journey.unlockedPowers(2, 0), ['tornado', 'lightning'], 'σταθμός 3');
  eq(journey.unlockedPowers(4, 0), ['tornado', 'lightning', 'ice'], 'σταθμός 5');
  eq(journey.unlockedPowers(0, 1), ['tornado', 'lightning', 'ice'], '2ος κύκλος');
  eq(journey.powerUnlockedAt(2, 0), 'lightning', 'ο κεραυνός ανακοινώνεται στον 3ο');
  eq(journey.powerUnlockedAt(0, 0), null, 'ο ανεμοστρόβιλος υπάρχει από την αρχή');
  eq(journey.bossHp(6), 8, 'στο κάστρο πιο ανθεκτικός');
});
