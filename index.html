<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#141A33">
<title>Ο Δρόμος της Φλόγας</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/img/icon-192.png">
<link rel="apple-touch-icon" href="assets/img/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="src/parent/parent.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0B0E1F; }
  body {
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  #game { position: fixed; inset: 0; }
  #game canvas { display: block; }

  /* Το παιχνίδι παίζεται πλαγιαστά (DESIGN: landscape-first) */
  #rotate {
    display: none; position: fixed; inset: 0; z-index: 90;
    background: #141A33; color: #EDE9DC;
    font-family: 'Comfortaa', 'Segoe UI', sans-serif;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; text-align: center; padding: 32px;
  }
  #rotate .icon { font-size: 3rem; color: #FFC857; animation: tilt 2.4s ease-in-out infinite; }
  #rotate h2 { font-size: 1.25rem; font-weight: 700; color: #FFE8A3; }
  #rotate p { font-size: .92rem; color: #7C86A0; max-width: 26ch; line-height: 1.6; }
  @keyframes tilt { 0%, 60%, 100% { transform: rotate(0); } 80% { transform: rotate(-90deg); } }
  @media (prefers-reduced-motion: reduce) { #rotate .icon { animation: none; } }
  @media (orientation: portrait) { #rotate { display: flex; } }

  /* Εφεδρική είσοδος γονέα (η κύρια είναι 5 αγγίγματα στο φεγγάρι) */
  #status {
    position: fixed; right: 0; bottom: 0; width: 64px; height: 44px;
    z-index: 95; opacity: 0;
  }
</style>
</head>
<body>
  <div id="game"></div>

  <div id="rotate">
    <div class="icon">▯</div>
    <h2>Γύρισε τη συσκευή σου</h2>
    <p>Ο Δρόμος της Φλόγας παίζεται πλαγιαστά.</p>
  </div>

  <div id="status"></div>
  <div id="parent-root"></div>

  <script src="vendor/phaser.min.js"></script>
  <script type="module" src="src/parent/parent.js"></script>
  <script type="module" src="src/game/main.js"></script>
  <script>
    // Το offline cache ενεργοποιείται ΜΟΝΟ στην κανονική διεύθυνση.
    // Στο localhost μένει κλειστό, αλλιώς κάθε αλλαγή κώδικα «κρύβεται»
    // πίσω από την παλιά αποθηκευμένη έκδοση κατά την ανάπτυξη.
    const isDev = ['localhost', '127.0.0.1'].includes(location.hostname);
    if ('serviceWorker' in navigator) {
      if (isDev) {
        navigator.serviceWorker.getRegistrations()
          .then((rs) => rs.forEach((r) => r.unregister()));
        if (window.caches) caches.keys().then((ks) => ks.forEach((k) => caches.delete(k)));
      } else {
        window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
      }
    }
  </script>
</body>
</html>
